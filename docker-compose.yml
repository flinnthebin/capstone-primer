services:
  db:
    build:
      context: db/
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: marksuser
      POSTGRES_PASSWORD: markspass
      POSTGRES_DB: marksdb
    ports:
      - "5432:5432"
    volumes:
      - data_sql:/var/lib/postgresql

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_NAME: marksdb
      DB_USER: marksuser
      DB_PASSWORD: markspass
    ports:
      - "5000:5000"
    depends_on:
      - db
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend


  automark:
    build: ./automark
    depends_on:
      - backend
      - db
    profiles:
      - debug
volumes:
  data_sql:
